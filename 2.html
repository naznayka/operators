<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Найбільше число</title>

    <style>
        body {
    font-family: Arial;
    text-align: center;
    margin-top: 100px;
    background: lightblue;
}

input {
    padding: 10px;
    margin: 5px;
}

button {
    padding: 10px 20px;
    background: blue;
    color: white;
    border: none;
}

#res {
    margin-top: 20px;
    font-size: 20px;
}
    </style>
</head>

<body>

    <div class="card">

        <h1>Пошук найбільшого числа</h1>

        <input type="text" id="a" placeholder="Введіть перше число">

        <input type="text" id="b" placeholder="Введіть друге число">

        <input type="text" id="c" placeholder="Введіть третє число">

        <button id="btn">Знайти</button>

        <p id="res">Результат</p>

    </div>

    <script>

        let btn = document.getElementById("btn");

        btn.addEventListener("click", findMax);

        function findMax() {

            let a = parseInt(document.getElementById("a").value);
            let b = parseInt(document.getElementById("b").value);
            let c = parseInt(document.getElementById("c").value);

            let result = document.getElementById("res");

            let max = a;

            if (b > max) {
                max = b;
            }

            if (c > max) {
                max = c;
            }

            result.innerHTML = "Найбільше число: " + max;
            result.style.color = "#16a34a";
        }

    </script>

</body>

</html>
