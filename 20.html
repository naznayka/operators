<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перевірка року</title>

        <style>
        body {
    font-family: Arial;
    text-align: center;
    margin-top: 100px;
    background: lightblue;
}

input {
    padding: 10px;
    margin: 5px;
}

button {
    padding: 10px 20px;
    background: blue;
    color: white;
    border: none;
}

#res {
    margin-top: 20px;
    font-size: 20px;
}
    </style>
</head>

<body>

    <div class="card">

        <h1>Перевірка високосного року</h1>

        <input type="text" id="year" placeholder="Введіть рік">

        <button id="btn">Перевірити</button>

        <p id="res">Результат</p>

    </div>

    <script>

        let btn = document.getElementById("btn");

        btn.addEventListener("click", checkYear);

        function checkYear() {

            let year = parseInt(document.getElementById("year").value);

            let result = document.getElementById("res");

            if (
                (year % 4 === 0 && year % 100 !== 0) ||
                (year % 400 === 0)
            ) {

                result.innerHTML = "Рік високосний";
                result.style.color = "green";

            } else {

                result.innerHTML = "Рік не високосний";
                result.style.color = "red";
            }
        }

    </script>

</body>

</html>
